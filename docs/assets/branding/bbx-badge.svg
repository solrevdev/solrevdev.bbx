<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC"/>
      <stop offset="100%" style="stop-color:#172B4D"/>
    </linearGradient>
  </defs>
  
  <!-- Background pill -->
  <rect width="200" height="80" rx="12" fill="url(#badgeBg)"/>
  
  <!-- Terminal prompt symbol -->
  <text x="25" y="52" font-family="SF Mono, Monaco, Consolas, monospace" font-size="32" fill="#4FD1C5">›</text>
  
  <!-- BBX text -->
  <text x="55" y="54" font-family="SF Pro Display, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white">bbx</text>
  
  <!-- CLI label -->
  <rect x="130" y="25" width="50" height="30" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="155" y="46" font-family="SF Mono, Monaco, monospace" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">CLI</text>
</svg>
