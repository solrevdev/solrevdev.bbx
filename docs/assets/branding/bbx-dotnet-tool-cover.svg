<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC"/>
      <stop offset="50%" style="stop-color:#0747A6"/>
      <stop offset="100%" style="stop-color:#172B4D"/>
    </linearGradient>
    
    <!-- Gradient for terminal window -->
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.02)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(255,255,255,0.02)"/>
  <circle cx="900" cy="80" r="100" fill="rgba(79,209,197,0.05)"/>
  
  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="900" height="400" rx="12" fill="url(#terminalGradient)"/>
    
    <!-- Terminal header bar -->
    <rect x="150" y="120" width="900" height="40" rx="12" fill="#374151"/>
    <rect x="150" y="148" width="900" height="12" fill="#374151"/>
    
    <!-- Traffic lights -->
    <circle cx="180" cy="140" r="7" fill="#EF4444"/>
    <circle cx="205" cy="140" r="7" fill="#F59E0B"/>
    <circle cx="230" cy="140" r="7" fill="#10B981"/>
    
    <!-- Terminal title -->
    <text x="600" y="146" font-family="SF Mono, Monaco, Consolas, monospace" font-size="14" fill="#9CA3AF" text-anchor="middle">bbx — Bitbucket Cloud CLI</text>
  </g>
  
  <!-- Terminal content -->
  <g font-family="SF Mono, Monaco, Consolas, monospace">
    <!-- Command prompt 1 -->
    <text x="180" y="200" font-size="18" fill="#10B981">$</text>
    <text x="200" y="200" font-size="18" fill="#E5E7EB"> dotnet tool install -g </text>
    <text x="480" y="200" font-size="18" fill="#60A5FA">solrevdev.bbx</text>
    
    <!-- Command prompt 2 -->
    <text x="180" y="240" font-size="18" fill="#10B981">$</text>
    <text x="200" y="240" font-size="18" fill="#E5E7EB"> bbx auth login --app-password</text>
    
    <!-- Output -->
    <text x="180" y="280" font-size="16" fill="#6B7280">✓ Authenticated as solrevdev</text>
    
    <!-- Command prompt 3 -->
    <text x="180" y="330" font-size="18" fill="#10B981">$</text>
    <text x="200" y="330" font-size="18" fill="#E5E7EB"> bbx pr list --workspace myteam --repo api</text>
    
    <!-- JSON output preview -->
    <text x="180" y="370" font-size="16" fill="#F59E0B">{</text>
    <text x="200" y="400" font-size="15" fill="#9CA3AF">"pull_requests": [</text>
    <text x="220" y="428" font-size="15" fill="#60A5FA">{ "id": 42, "title": "Add new feature" }</text>
    <text x="200" y="456" font-size="15" fill="#9CA3AF">], "count": 3</text>
    <text x="180" y="484" font-size="16" fill="#F59E0B">}</text>
  </g>
  
  <!-- BBX Logo/Badge -->
  <g transform="translate(970, 440)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="rgba(0,0,0,0.3)"/>
    <text x="60" y="34" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#glow)">bbx</text>
  </g>
  
  <!-- Bitbucket icon stylized -->
  <g transform="translate(1050, 180)">
    <path d="M0 0 L30 0 L25 40 L5 40 Z" fill="#2684FF" opacity="0.8"/>
    <path d="M5 40 L25 40 L22 70 L8 70 Z" fill="#0052CC" opacity="0.8"/>
  </g>
  
  <!-- .NET badge -->
  <g transform="translate(1020, 280)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="#512BD4"/>
    <text x="40" y="19" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">.NET 10</text>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="580" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="middle">Bitbucket Cloud API v2 CLI for LLM Integration</text>
  
  <!-- solrevdev branding -->
  <text x="600" y="608" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">solrevdev.com</text>
</svg>
